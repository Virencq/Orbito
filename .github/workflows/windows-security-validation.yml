name: Windows security and build validation

on:
  push:
    branches:
      - security/phase-1-t1-csp
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install LLVM for native speech bindings
        shell: pwsh
        run: choco install llvm --yes --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Check TypeScript and build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Check native Rust application
        run: npm run native:check

      - name: Build Windows installer once
        run: npm run tauri:build
