[package]
name = "s-loop-speech"
version = "0.1.0"
description = "Local speech input, streaming recognition, and text-to-speech engine for S-Loop"
edition = "2021"
rust-version = "1.91"
license = "MIT"

[dependencies]
best-tts = { git = "https://github.com/studio-ransom/best-tts-rust" }
bzip2 = "0.4"
cpal = "0.15.3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sherpa-onnx = { version = "1.13.4", default-features = false, features = ["static"] }
sonora = "0.2.0"
tar = "0.4"
ureq = "2.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
serde_json = "1"

[target.'cfg(not(target_os = "windows"))'.dependencies]
whisper-rs = "0.16"
